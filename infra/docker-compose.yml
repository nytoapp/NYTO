# Local development dependencies for Atlas.
# PostgreSQL stores the system of record, including geography.
# Redis stores rate limits, revocation hints, and circuit state.
# Credentials below are development defaults and must not be reused in production.

services:
  postgres:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas
      POSTGRES_DB: atlas
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - atlas_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - atlas_redis:/data

volumes:
  atlas_postgres:
  atlas_redis:
